[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberiq-security-tools"
version = "9.6.0"
description = "Offline-first defensive cybersecurity analysis toolkit by CyberIQ."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Muqtada Al-Sadr Jarallah Khalif"}]
keywords = ["cybersecurity","defensive-security","ctf","education","cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
[project.urls]
Repository = "https://github.com/hfsduu5-coder/CyberIQ-Security-Tools-CYBERiQ"
Issues = "https://github.com/hfsduu5-coder/CyberIQ-Security-Tools-CYBERiQ/issues"

[project.scripts]
cyberiq-tools = "cyberiq_tools.cli:main"

[tool.setuptools.packages.find]
include = ["cyberiq_tools*"]
